<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>BarberOS</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- TAILWIND -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ICONS -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0A0A0A;
      color: white;
      overflow: hidden;
    }

    .screen {
      display: none;
      animation: fade .25s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .glass {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(20px);
    }

    .card {
      background: #141414;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }

    .bottom-sheet {
      transform: translateY(100%);
      transition: .35s ease;
    }

    .bottom-sheet.open {
      transform: translateY(0%);
    }

    .overlay {
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    input,
    select {
      outline: none;
    }

    ::-webkit-scrollbar {
      width: 0px;
    }
  </style>
</head>

<body class="h-screen flex flex-col">

  <!-- APP -->
  <div class="flex-1 overflow-hidden">

    <!-- DASHBOARD -->
    <section id="dashboardScreen" class="screen active h-full overflow-y-auto px-5 pt-8 pb-32">

      <!-- HEADER -->
      <div class="mb-8">

        <p class="text-white/40 text-sm">
          BarberOS
        </p>

        <h1 class="text-4xl font-semibold tracking-tight mt-2">
          Sua barbearia.
          <br/>
          Em movimento.
        </h1>

      </div>

      <!-- METRICS -->
      <div class="space-y-4">

        <!-- FATURAMENTO -->
        <div class="card rounded-[32px] p-6">

          <div class="flex items-start justify-between">

            <div>

              <p class="text-white/40 text-sm">
                Faturamento Total
              </p>

              <h2
                id="totalRevenue"
                class="text-4xl font-semibold mt-4"
              >
                R$ 0
              </h2>

            </div>

            <div class="w-14 h-14 rounded-2xl bg-emerald-400/10 flex items-center justify-center">
              <i data-lucide="trending-up" class="text-emerald-400"></i>
            </div>

          </div>

        </div>

        <!-- CORTES -->
        <div class="card rounded-[32px] p-6 flex items-center justify-between">

          <div>

            <p class="text-white/40 text-sm">
              Cortes Realizados
            </p>

            <h2
              id="totalCuts"
              class="text-3xl font-semibold mt-3"
            >
              0
            </h2>

          </div>

          <div class="w-14 h-14 rounded-2xl bg-white/5 flex items-center justify-center">
            <i data-lucide="scissors"></i>
          </div>

        </div>

      </div>

      <!-- CLIENTES -->
      <div class="mt-10">

        <div class="flex items-center justify-between mb-5">

          <div>
            <h3 class="text-2xl font-semibold">
              Próximos Clientes
            </h3>

            <p class="text-white/40 text-sm mt-1">
              Agenda em tempo real
            </p>
          </div>

        </div>

        <div
          id="upcomingList"
          class="space-y-4"
        ></div>

      </div>

    </section>

    <!-- AGENDA -->
    <section id="agendaScreen" class="screen h-full overflow-y-auto px-5 pt-8 pb-32">

      <div class="mb-8">

        <p class="text-white/40 text-sm">
          Agenda
        </p>

        <h1 class="text-4xl font-semibold tracking-tight mt-2">
          Todos os horários
        </h1>

      </div>

      <div
        id="agendaList"
        class="space-y-4"
      ></div>

    </section>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="fixed bottom-0 left-0 right-0 bg-black/70 backdrop-blur-2xl border-t border-white/5 px-6 py-5 flex items-center justify-between z-50">

    <!-- DASHBOARD -->
    <button
      onclick="switchScreen('dashboard')"
      class="flex flex-col items-center gap-1 text-white"
    >
      <i data-lucide="layout-dashboard"></i>
      <span class="text-xs">Dashboard</span>
    </button>

    <!-- ADD -->
    <button
      onclick="openModal()"
      class="w-20 h-20 rounded-full bg-white text-black flex items-center justify-center -mt-10 shadow-2xl"
    >
      <i data-lucide="plus" class="w-8 h-8"></i>
    </button>

    <!-- AGENDA -->
    <button
      onclick="switchScreen('agenda')"
      class="flex flex-col items-center gap-1 text-white"
    >
      <i data-lucide="calendar-days"></i>
      <span class="text-xs">Agenda</span>
    </button>

  </nav>

  <!-- OVERLAY -->
  <div
    id="overlay"
    class="overlay fixed inset-0 bg-black/70 backdrop-blur-sm z-[90]"
    onclick="closeModal()"
  ></div>

  <!-- MODAL -->
  <div
    id="bottomSheet"
    class="bottom-sheet fixed bottom-0 left-0 right-0 z-[100] bg-[#111111] rounded-t-[40px] p-6 pb-10 border-t border-white/5"
  >

    <div class="w-16 h-1.5 rounded-full bg-white/10 mx-auto mb-8"></div>

    <div class="flex items-center justify-between mb-8">

      <div>
        <p class="text-white/40 text-sm">
          Novo Agendamento
        </p>

        <h2 class="text-3xl font-semibold mt-1">
          Adicionar cliente
        </h2>
      </div>

      <button onclick="closeModal()">
        <i data-lucide="x"></i>
      </button>

    </div>

    <!-- FORM -->
    <div class="space-y-4">

      <!-- CLIENTE -->
      <input
        id="clienteInput"
        type="text"
        placeholder="Nome do Cliente"
        class="w-full h-16 rounded-3xl bg-[#1A1A1A] px-5 text-white placeholder:text-white/30"
      />

      <!-- SERVIÇO -->
      <select
        id="servicoInput"
        class="w-full h-16 rounded-3xl bg-[#1A1A1A] px-5 text-white"
      >
        <option value="">Selecione o serviço</option>
        <option>Corte</option>
        <option>Barba</option>
        <option>Corte + Barba</option>
        <option>Sobrancelha</option>
      </select>

      <!-- VALOR -->
      <input
        id="valorInput"
        type="number"
        placeholder="Valor (R$)"
        class="w-full h-16 rounded-3xl bg-[#1A1A1A] px-5 text-white placeholder:text-white/30"
      />

      <!-- DATA -->
      <input
        id="dataInput"
        type="datetime-local"
        class="w-full h-16 rounded-3xl bg-[#1A1A1A] px-5 text-white"
      />

      <!-- BTN -->
      <button
        onclick="saveAppointment()"
        class="w-full h-16 rounded-3xl bg-white text-black font-semibold text-lg mt-4"
      >
        Salvar Agendamento
      </button>

    </div>

  </div>

  <!-- JS -->
  <script>

    lucide.createIcons();

    // =========================
    // DATABASE
    // =========================

    function getAppointments() {
      return JSON.parse(localStorage.getItem("agendamentos")) || [];
    }

    function saveAppointments(data) {
      localStorage.setItem("agendamentos", JSON.stringify(data));
    }

    // =========================
    // SCREENS
    // =========================

    function switchScreen(screen) {

      document
        .querySelectorAll(".screen")
        .forEach(s => s.classList.remove("active"));

      if(screen === "dashboard") {
        document
          .getElementById("dashboardScreen")
          .classList.add("active");
      }

      if(screen === "agenda") {
        document
          .getElementById("agendaScreen")
          .classList.add("active");
      }

    }

    // =========================
    // MODAL
    // =========================

    function openModal() {
      document
        .getElementById("overlay")
        .classList.add("active");

      document
        .getElementById("bottomSheet")
        .classList.add("open");
    }

    function closeModal() {
      document
        .getElementById("overlay")
        .classList.remove("active");

      document
        .getElementById("bottomSheet")
        .classList.remove("open");
    }

    // =========================
    // SAVE APPOINTMENT
    // =========================

    function saveAppointment() {

      const nome = document
        .getElementById("clienteInput")
        .value
        .trim();

      const servico = document
        .getElementById("servicoInput")
        .value;

      const valor = document
        .getElementById("valorInput")
        .value;

      const data = document
        .getElementById("dataInput")
        .value;

      if(!nome || !servico || !valor || !data) {
        alert("Preencha todos os campos.");
        return;
      }

      const appointments = getAppointments();

      appointments.push({
        id: Date.now(),
        nome,
        servico,
        valor: Number(valor),
        data
      });

      saveAppointments(appointments);

      clearForm();

      closeModal();

      renderUI();

    }

    // =========================
    // CLEAR FORM
    // =========================

    function clearForm() {

      document.getElementById("clienteInput").value = "";
      document.getElementById("servicoInput").value = "";
      document.getElementById("valorInput").value = "";
      document.getElementById("dataInput").value = "";

    }

    // =========================
    // DELETE APPOINTMENT
    // =========================

    function deleteAppointment(id) {

      const appointments = getAppointments();

      const updated = appointments.filter(
        item => item.id !== id
      );

      saveAppointments(updated);

      renderUI();

    }

    // =========================
    // FORMAT DATE
    // =========================

    function formatDate(dateString) {

      const date = new Date(dateString);

      return date.toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });

    }

    // =========================
    // RENDER UI
    // =========================

    function renderUI() {

      const appointments = getAppointments();

      // ORDER
      appointments.sort((a,b) =>
        new Date(a.data) - new Date(b.data)
      );

      // METRICS
      const totalRevenue = appointments.reduce(
        (acc, item) => acc + item.valor,
        0
      );

      document.getElementById(
        "totalRevenue"
      ).innerText =
        totalRevenue.toLocaleString('pt-BR', {
          style: 'currency',
          currency: 'BRL'
        });

      document.getElementById(
        "totalCuts"
      ).innerText = appointments.length;

      // DASHBOARD LIST
      const upcomingList =
        document.getElementById("upcomingList");

      upcomingList.innerHTML = "";

      if(appointments.length === 0) {

        upcomingList.innerHTML = `
          <div class="card rounded-[32px] p-6 text-center text-white/40">
            Nenhum horário cadastrado.
          </div>
        `;

      } else {

        appointments.slice(0,5).forEach(item => {

          upcomingList.innerHTML += `

            <div class="card rounded-[32px] p-5 flex items-center justify-between">

              <div class="flex items-center gap-4">

                <div class="w-14 h-14 rounded-2xl bg-white/5 flex items-center justify-center">
                  <i data-lucide="scissors"></i>
                </div>

                <div>

                  <h3 class="font-semibold text-lg">
                    ${item.nome}
                  </h3>

                  <p class="text-white/40 text-sm mt-1">
                    ${item.servico}
                  </p>

                </div>

              </div>

              <div class="text-right">

                <p class="font-semibold">
                  ${formatDate(item.data)}
                </p>

                <p class="text-emerald-400 text-sm mt-1">
                  R$ ${item.valor}
                </p>

              </div>

            </div>

          `;

        });

      }

      // AGENDA LIST
      const agendaList =
        document.getElementById("agendaList");

      agendaList.innerHTML = "";

      if(appointments.length === 0) {

        agendaList.innerHTML = `
          <div class="card rounded-[32px] p-6 text-center text-white/40">
            Nenhum horário encontrado.
          </div>
        `;

      } else {

        appointments.forEach(item => {

          agendaList.innerHTML += `

            <div class="card rounded-[32px] p-5">

              <div class="flex items-start justify-between gap-4">

                <div>

                  <div class="flex items-center gap-3">

                    <h3 class="text-xl font-semibold">
                      ${item.nome}
                    </h3>

                    <span class="text-xs px-3 py-1 rounded-full bg-white/5">
                      ${item.servico}
                    </span>

                  </div>

                  <p class="text-white/40 mt-3">
                    ${formatDate(item.data)}
                  </p>

                  <p class="text-emerald-400 mt-2 font-medium">
                    R$ ${item.valor}
                  </p>

                </div>

                <button
                  onclick="deleteAppointment(${item.id})"
                  class="w-12 h-12 rounded-2xl bg-red-500/10 text-red-400 flex items-center justify-center"
                >
                  <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>

              </div>

            </div>

          `;

        });

      }

      lucide.createIcons();

    }

    // =========================
    // INIT
    // =========================

    renderUI();

  </script>

</body>
</html>
